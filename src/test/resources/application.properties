# Testcontainers JDBC URL - it will auto-start the container
spring.datasource.url=jdbc:tc:mysql:8.0.33:///book_store
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# These are ignored by Testcontainers but Spring needs them defined
spring.datasource.username=test
spring.datasource.password=test

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Your app properties
jwt.expiration=300000
jwt.secret=combookstore1234567887654321bookstore

spring.liquibase.enabled=false
